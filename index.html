<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pack It Perfect — Local Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8dfd1; }
    body { display: grid; place-items: center; font: 16px system-ui, sans-serif; color: #1e2a3a; }
    #game { position: relative; width: min(100vw, 60vh); height: min(100vh, 166.6667vw); background: #fff8ee; }
    @supports (height: 100dvh) { #game { width: min(100vw, 60dvh); height: min(100dvh, 166.6667vw); } }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 20px; background: #fff8ee; }
    #loading[hidden] { display: none; }
    progress { width: 70%; accent-color: #3fb68b; }
    #error { position: absolute; inset: 20px; overflow: auto; white-space: pre-wrap; background: #fff8ee; padding: 20px; }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="480" height="800" tabindex="0" aria-label="Pack It Perfect"></canvas>
    <div id="loading" role="status"><strong>Pack It Perfect</strong><span>Đang tải game…</span><progress max="1" value="0"></progress></div>
    <div id="error" role="alert" hidden></div>
  </main>
  <script>
    const canvas = document.querySelector("canvas");
    const loading = document.querySelector("#loading");
    function showError(message) {
      loading.hidden = true;
      const error = document.querySelector("#error");
      error.textContent = String(message);
      error.hidden = false;
    }
    const config = {
      dataUrl: "Build/local.data",
      frameworkUrl: "Build/local.framework.js",
      codeUrl: "Build/local.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Pack It Perfect",
      productVersion: "1.1.1",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: (message, type) => type === "error" ? showError(message) : console.warn(message),
    };
    const script = document.createElement("script");
    script.src = "Build/local.loader.js";
    script.onerror = () => showError("Không tải được game. Hãy mở bằng server local, không mở trực tiếp file HTML.");
    script.onload = () => createUnityInstance(canvas, config, value => {
      document.querySelector("progress").value = value;
    }).then(instance => {
      window.unityInstance = instance;
      loading.hidden = true;
      canvas.focus();
    }).catch(showError);
    document.body.appendChild(script);
  </script>
</body>
</html>
